name: Build StemMac

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app (unsigned)
        run: |
          xcodebuild -project StemDeck.xcodeproj -scheme StemDeck \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Release/StemMac.app build/StemMac-unsigned.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StemMac-unsigned
          path: build/StemMac-unsigned.zip
